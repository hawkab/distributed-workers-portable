name: Component release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or resume
        required: true
        type: string

permissions:
  contents: write

jobs:
  node_conformance:
    name: Node conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Native Node execution and streaming tests
        run: node --test tests/node.test.mjs

  release:
    needs: node_conformance
    runs-on: ubuntu-latest
    env:
      FLEET_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publisher regression tests
        run: python3 -m unittest discover -s ci/tests -v
      - name: Verify canonical artifacts and publish this mirror
        run: python3 -B ci/portable_release.py release --provider github
